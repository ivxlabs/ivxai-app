[package]
name = "ivx-app"
description = "A lightweight, browser-based chat client designed for users who want total control over their data and their AI interactions."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
# Tauri builds the mobile targets as a library and links it from the platform
# project, so this crate has to be all three shapes at once.
name = "ivx_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# The same server the standalone daemon runs. Desktop, mobile and "just the
# daemon" therefore take one code path through the UI, not three.
ivxai-bridge = { path = "../crates/ivxai-bridge", default-features = false }
tokio = { version = "1", features = ["net", "rt"] }
